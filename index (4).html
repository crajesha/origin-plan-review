<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Plan Review Assistant — Origin Drywall Submission</title>
<style>
  html, body { margin:0; padding:0; background:#F5F4FC; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  * { box-sizing: border-box; }
  #wrap { max-width: 680px; margin: 24px auto; padding: 0 16px; }
  #card { border: 1px solid #E3E1F5; border-radius: 16px; overflow: hidden; background: #fff; box-shadow: 0 1px 6px rgba(0,0,0,0.06); }
  #head { background: linear-gradient(135deg, #4A3AFF, #6E5AF5); color: #fff; padding: 16px 20px; }
  #head .t { font-weight: 700; font-size: 16px; }
  #head .s { font-size: 12.5px; opacity: 0.85; margin-top: 2px; }
  #log { height: 420px; overflow-y: auto; padding: 16px 16px 4px; }
  .msg { display:flex; margin-bottom:12px; }
  .msg.user { justify-content: flex-end; }
  .bubble { max-width: 82%; padding: 10px 14px; font-size: 14.5px; line-height: 1.5; white-space: pre-wrap; border-radius: 14px 14px 14px 4px; }
  .msg.user .bubble { background: #4A3AFF; color: #fff; border-radius: 14px 14px 4px 14px; }
  .msg.assistant .bubble { background: #F3F2FF; color: #1A1533; }
  #thinking { color: #8B85B8; font-size: 13.5px; margin-bottom: 8px; }
  #suggested { padding: 8px 16px; display:flex; flex-wrap:wrap; gap:6px; }
  .chip { font-size:12px; padding:5px 10px; border-radius:999px; border:1px solid #DAD6F5; background:#FAFAFF; color:#4A3AFF; cursor:pointer; }
  .chip:disabled { opacity: 0.5; cursor: default; }
  #inputRow { display:flex; gap:8px; padding:16px; border-top:1px solid #F0EFFB; }
  #q { flex:1; padding:10px 12px; border-radius:10px; border:1px solid #DAD6F5; font-size:14px; outline:none; }
  #send { padding:10px 18px; border-radius:10px; border:none; background:#4A3AFF; color:#fff; font-weight:600; font-size:14px; cursor:pointer; }
  #send:disabled { opacity:0.6; cursor:default; }
  #note { font-size: 11.5px; color: #9490B5; text-align: center; margin-top: 10px; }
</style>
</head>
<body>
<div id="wrap">
  <div id="card">
    <div id="head">
      <div class="t">Plan Review Assistant</div>
      <div class="s">Grounded only in your Origin drywall submission — a study tool, not a submission artifact</div>
    </div>
    <div id="log"></div>
    <div id="suggested"></div>
    <div id="inputRow">
      <input id="q" type="text" placeholder="Ask about your experiment design, matrix, hypotheses..." />
      <button id="send">Ask</button>
    </div>
  </div>
  <div id="note">Answers are restricted to the text of your submitted plan. Nothing here should be treated as new engineering analysis.</div>
</div>

<script>
const DOC_TEXT = "Robotic Drywall Finishing\n\nFirst-Round Experimental Validation Plan | Apprentice \u2014 Experimentation\n& Systems Engineering\n\nCandidate: Chigateri Rajesha Date: 12 August 2026\n\nProblem framing. Repeated robot finishing trials produce inconsistent\ntapered-seam quality: underfill in the taper valley, excess material\nbuildup, visible edge lines, and post-sand surface waviness. The brief\ndoes not identify a root cause. My objective is therefore to separate\nprocess variation from measurement variation and identify which\nsubsystem(s) deserve the next round of controlled testing.\n\n1. System understanding\n\n[]\n\nFigure 1. System-level diagram \u2014 motion, end-effector, material,\nsensing, and geometry feed the finishing process, with environment and\nmeasurement method acting across the whole system.\n\nKey systems judgment: I would not start by blaming material. The same\nvisible defect can be produced by different mechanisms \u2014 for example,\nunderfill could reflect insufficient deposition, excessive speed,\nexcessive standoff, or a material-state change. The first round should\ntherefore test one representative factor per subsystem under matched\nconditions, while tracking measurement reliability and trial order.\n\nDrywall quality target. A correctly finished tapered seam should\ntransition smoothly into the surrounding board so the joint is not\nvisually or physically prominent after finishing/sanding. Underfill\nleaves the recess insufficiently filled; buildup leaves excess compound;\nedge lines indicate an abrupt/visible transition; waviness indicates\nresidual surface non-flatness after sanding. These are quality\ndepartures, not merely sensor signals.\n\nPrimary working hypothesis: the observed variation is likely\nmulti-factor rather than a single-cause failure. My first-round goal is\nto determine whether the largest repeatable changes trace to motion,\ntool behavior, sensing/standoff, material state, or their interactions \u2014\nnot to declare a root cause from one trial.\n\n2. Experiment design\n\nObjective: quantify baseline repeatability, then screen representative\ncontrollable factors from the four major subsystems while holding\ngeometry, measurement setup, and the remaining process settings fixed.\n\nWorking hypotheses\n\n-   H1 \u2014 Motion: path velocity and tool orientation can change\n    deposition/finishing consistency and therefore seam profile,\n    underfill/buildup, or edge-line severity.\n\n-   H2 \u2014 End-effector: application-tool condition/rate and sanding\n    contact force can change material deposition and final surface\n    waviness.\n\n-   H3 \u2014 Sensing: standoff error or sensor calibration drift can create\n    real process changes and/or apparent quality changes; measurement\n    reliability must be validated before attributing process variation.\n\n-   H4 \u2014 Material: viscosity/mix-state variation can change how\n    consistently compound is deposited and finished.\n\nImportant: these are testable hypotheses, not conclusions. Evidence for\none factor should be interpreted only after its competing explanations\nare controlled.\n\n2.1 First-round run structure\n\n  --------------------------------------------------------------------------------\n  Block          Runs   Purpose                Design\n  -------------- ------ ---------------------- -----------------------------------\n  A \u2014 Baseline   4      Estimate inherent      Same nominal settings; repeat\n                        run-to-run variation   across time/order\n\n  B \u2014 Motion     4      Screen velocity /      2 levels x 2 repeats; all else\n                        orientation effect     fixed\n\n  C \u2014            4      Screen                 2 levels x 2 repeats; all else\n  End-effector          tool/application       fixed\n                        effect                 \n\n  D \u2014 Sensing    4      Test                   2 controlled levels x 2 repeats;\n                        standoff/calibration   verify measurement setup\n                        sensitivity            \n\n  E \u2014 Material   4      Screen material-state  2 levels x 2 repeats; characterize\n                        effect                 material before run\n  --------------------------------------------------------------------------------\n\nTotal = 20 runs. This is a screening plan, not a final optimization\nstudy. With only two repeats at each shifted level, the evidence is\nintentionally treated as directional; factors showing a clear and\nrepeatable effect move to a stronger confirmatory test.\n\n2.2 Controls, disturbances and confounders\n\n  -------------------------------------------------------------------------\n  Category        Examples / control action\n  --------------- ---------------------------------------------------------\n  Controlled      Same seam geometry/panel type; same tool path except\n                  tested factor; same compound preparation protocol; same\n                  sanding procedure; same measurement fixture and\n                  camera/sensor pose.\n\n  Disturbances    Temperature/humidity; material aging during the session;\n                  tool wear; sensor thermal drift; panel-to-panel\n                  variation.\n\n  Confounders     Changing velocity and standoff together; allowing\n                  viscosity to drift with time; tool wear correlated with\n                  trial number; recalibrating only after poor runs;\n                  lighting changes between measurements.\n\n  Randomization / Randomize factor-level order where practical; interleave\n  blocking        baseline checks so drift is visible; record trial\n                  timestamp and tool/material state.\n  -------------------------------------------------------------------------\n\nWhy this structure? A baseline block tells me how noisy the process is\nbefore I attribute differences to a factor. Interleaved baseline checks\nhelp expose drift. The four subsystem blocks provide a practical first\nscreen without pretending a 20-run study can estimate every interaction.\n\n3. Measurement strategy\n\nMeasurement principle: score the finished seam using the same physical\nregion, fixture, sensor pose, lighting, and analysis method for every\nrun. Capture measurements at defined process stages rather than relying\non memory or a final visual impression.\n\n  --------------------------------------------------------------------------------\n  Metric       How I would measure        When                 Use\n  ------------ -------------------------- -------------------- -------------------\n  Seam profile Vision/ranging profile     After                Primary geometric\n  deviation    across a fixed             application/finish   quality signal\n               cross-section; compare     and after sanding    \n               measured profile with the                       \n               target/reference profile.                       \n\n  Flatness /   Profile deviation over a   After sanding        Detect residual\n  waviness     fixed seam length; report                       surface variation\n               a repeatable                                    \n               waviness/flatness metric.                       \n\n  Underfill /  Quantify signed profile    After finishing;     Distinguish too\n  buildup      deviation or classify      confirm after        little vs too much\n               against a predefined       sanding              compound\n               defect rubric; do not                           \n               change scoring rules                            \n               between trials.                                 \n\n  Edge-line    Fixed visual/geometry      After sanding        Capture visible\n  severity     score using the same                            transition defect\n               viewing setup and                               \n               reference examples.                             \n\n  Rework /     Record additional sanding  During/after         Practical\n  sanding      time/material/rework steps finishing            production impact\n  effort       required to reach                               \n               acceptance.                                     \n  --------------------------------------------------------------------------------\n\n3.1 Measurement-system reliability\n\nIf imaging/ranging is used, the measurement system becomes another\nsubsystem in the experiment. I would use a fixed camera/sensor mount,\ncontrolled lighting, a calibration artifact/reference surface before the\nsession, and periodic calibration checks. Standoff should be recorded\nbecause a change in sensor-to-surface distance can look like a process\nchange. For force-torque data, record zero/bias checks and watch for\ndrift over time.\n\nFair comparison rule: if a calibration check fails, flag the affected\nrun rather than silently correcting the result after seeing the outcome.\nRe-run the measurement under a known-good setup where possible. This\nprevents measurement correction from becoming outcome-dependent.\n\n3.2 Primary response variable\n\nI would keep several physical metrics rather than collapsing everything\nimmediately into one score. A composite quality score can hide\ntrade-offs \u2014 for example, a seam with good flatness but visible edge\nlines. For screening, I would rank factors by consistent effect across\nthe key metrics and by practical rework impact.\n\n4. Analysis and decision-making\n\nStep 1 \u2014 Establish baseline variation. Calculate run-to-run spread under\nnominal settings. This is the reference against which factor changes are\njudged.\n\nStep 2 \u2014 Compare within-factor contrasts. For each subsystem block,\ncompare the two tested levels while keeping the other variables fixed.\nExamine the direction and size of the change across repeats, not a\nsingle best/worst run.\n\nStep 3 \u2014 Check drift and confounding. Plot results against trial\norder/time. If quality deteriorates monotonically, tool wear, material\naging, or sensor drift may be responsible rather than the tested factor.\n\nStep 4 \u2014 Separate observation from conclusion. Example: \u201cHigher velocity\ncoincided with more underfill in both repeats\u201d is an observation.\n\u201cVelocity is the root cause\u201d is not justified until material state,\nstandoff, tool condition, and measurement reliability are controlled.\n\nStep 5 \u2014 Decide the next test from uncertainty. If one factor shows a\nrepeatable effect, confirm it with more repeats and tighter controls. If\ntwo factors appear coupled, test their interaction. If results are\nnoisy, first validate the measurement/process baseline rather than\nadding more factors.\n\n5. Experiment matrix / test plan\n\nThe matrix below is the concrete first-round plan. \u201cLow/High\u201d means a\ndeliberately separated, safe operating condition chosen from the actual\nsystem's validated range; the assessment does not provide numerical\nsetpoints, so I would not invent them.\n\n  -------------------------------------------------------------------------------------\n  Trial   Subsystem / factor        Level        Reps   Key controls    Primary outputs\n  ------- ------------------------- ------------ ------ --------------- ---------------\n  B1\u2013B2   Motion \u2014 path velocity    Low          2      Material, tool, Underfill;\n                                                        standoff,       profile\n                                                        geometry,       \n                                                        sensing         \n\n  B3\u2013B4   Motion \u2014 path velocity    High         2      Same            Underfill;\n                                                                        profile\n\n  C1\u2013C2   End-effector \u2014            Nominal vs   2      Velocity,       Buildup; edge\n          application/tool          shifted             material,       line\n          condition                                     standoff        \n\n  C3\u2013C4   End-effector \u2014 sander     Nominal vs   2      Velocity,       Waviness;\n          contact force             shifted             material,       sanding effort\n                                                        geometry        \n\n  D1\u2013D2   Sensing \u2014 standoff        Nominal vs   2      Motion, tool,   Profile; edge\n                                    controlled          material        line\n                                    offset                              \n\n  D3\u2013D4   Sensing \u2014                 Nominal vs   2      Process held    Measurement\n          calibration/measurement   introduced          constant        repeatability\n          check                     check                               \n                                    condition                           \n\n  E1\u2013E2   Material \u2014 viscosity/mix  Nominal vs   2      Motion, tool,   Underfill;\n          state                     controlled          standoff        buildup\n                                    shifted                             \n                                    state                               \n\n  E3\u2013E4   Material \u2014                Nominal vs   2      Motion, tool,   Profile; rework\n          rest/conditioning state   controlled          standoff        \n                                    shifted                             \n                                    state                               \n\n  A1\u2013A4   Baseline                  Nominal      4      All nominal;    All quality\n                                                        repeated across metrics\n                                                        session         \n  -------------------------------------------------------------------------------------\n\nNote on the sensing block: the goal is not to intentionally damage or\nmiscalibrate hardware. A controlled offset or calibration-check\ncondition should be created only within a safe, known range or by using\na measurement reference. If the actual sensor cannot be safely\nperturbed, replace this block with a repeated measurement-validation\ntest.\n\n6. Practical risks and constraints\n\n  -------------------------------------------------------------------------\n  Risk            Effect on conclusion     Mitigation\n  --------------- ------------------------ --------------------------------\n  Small sample    A large-looking          Use repeated baseline; treat\n  size            difference may be noise. screening results as\n                                           directional; confirm finalists.\n\n  Material        Can masquerade as        Standardize mixing, record\n  inconsistency   motion/tool effects.     batch/time/rest state,\n                                           characterize viscosity where\n                                           practical.\n\n  Tool wear-in /  Trial order becomes      Record tool state; interleave\n  wear            correlated with tool     baseline checks; inspect tool\n                  condition.               condition.\n\n  Sensor drift /  Can create false process Pre/post calibration checks;\n  calibration     variation.               fixed fixture; log drift; flag\n                                           invalid measurements.\n\n  Panel geometry  Different seams may have Use matched panels/seam\n                  different intrinsic      geometry; block by panel if\n                  difficulty.              multiple panels are unavoidable.\n\n  Limited robot   Cannot test every        Screen representative factors\n  time            interaction.             first; reserve runs for\n                                           confirmation and strongest\n                                           interaction.\n  -------------------------------------------------------------------------\n\n7. Second-round prioritization \u2014 if only 15\u201320 runs are available\n\nI would not pre-commit the second round to a subsystem before seeing\nfirst-round evidence. Instead, I would rank candidates using three\nquestions: (1) is the effect larger than baseline variation? (2) is it\nrepeatable across trials and not explained by drift/confounding? (3)\ndoes it have a plausible physical mechanism and practical quality\nimpact?\n\n  --------------------------------------------------------------------------\n  Priority      Runs    Purpose                  Decision rule\n  ------------- ------- ------------------------ ---------------------------\n  1. Confirm    5\u20136     Repeat the strongest     Effect persists and exceeds\n  top driver            first-round factor under baseline spread \u2192 promote\n                        tighter controls.        confidence.\n\n  2. Validate   3\u20134     Repeat reference         If measurement noise is\n  measurement           seam/measurement; check  large, fix measurement\n                        sensor or imaging        before process\n                        repeatability.           optimization.\n\n  3. Test       3\u20134     Confirm the next         If effect disappears,\n  second driver         strongest subsystem      first-round result may have\n                        factor.                  been noise/confounded.\n\n  4.            3\u20134     Test top two factors     Interaction matters if\n  Interaction           together if both survive combined effect differs\n                        confirmation.            materially from individual\n                                                 effects.\n  --------------------------------------------------------------------------\n\n7.1 Example decision logic\n\n-   If motion shows the clearest repeatable effect: confirm\n    velocity/orientation with more repeats, hold material viscosity and\n    standoff tightly, then test whether the effect remains after a\n    controlled tool-condition check.\n\n-   If material shows the clearest effect: characterize material state\n    first and repeat at controlled viscosity/rest conditions before\n    changing robot motion. This avoids blaming the robot for a feedstock\n    problem.\n\n-   If sensing/measurement is unstable: do not optimize the process yet.\n    First establish a trustworthy measurement baseline; otherwise the\n    experiment may optimize sensor artifacts.\n\n-   If two factors remain comparable: reserve runs for their\n    interaction. A factor that looks weak alone may matter when paired\n    with another subsystem state.\n\n8. Engineering conclusion\n\nMy current read is deliberately provisional: the problem should be\ntreated as a cross-subsystem variation problem. The highest-value first\nstep is not selecting a root cause; it is establishing a reliable\nbaseline and then screening one representative, controllable factor from\nmotion, end-effector, sensing/standoff, and material under matched\nconditions. The dominant driver is the factor whose effect is\nrepeatable, larger than baseline/measurement variation, physically\nplausible, and still present after confounders are controlled.\n\nThis approach directly addresses the brief's emphasis on systems\nthinking, experimentation rigor, measurement discipline,\nanalysis/judgment, and understanding of tapered-seam finish quality.\nWhere the brief does not provide numerical setpoints or sensor\nspecifications, I have stated assumptions rather than inventing them.\n\nSource basis: Origin's \u201cExperimentation & Systems Engineering \u2014 Robotic\nDrywall Finishing\u201d assessment brief and applicant brief supplied with\nthe assessment. The assessment itself specifies a concise 2\u20134 page\nsubmission, a system-level diagram, an experiment matrix/test-plan\ntable, explicit assumptions, and an optional 15\u201320 run second-round\nplan.\n";

const SUGGESTED = [
  "What is my primary working hypothesis?",
  "Why did I include a baseline block?",
  "What confounders am I tracking?",
  "How would I decide what to test in round 2?",
  "What's my fair-comparison rule for calibration failures?",
];

const SYSTEM_PROMPT = `You are a study assistant helping a candidate review their OWN submitted document before a job interview.

STRICT RULES:
- Answer ONLY using the document text provided below. Do not add outside knowledge about drywall, robotics, or Origin.
- If the answer isn't in the document, say clearly: "That's not covered in your document" and suggest what section might be relevant instead.
- Never invent numbers, specs, or claims not present in the text.
- Keep answers concise (2-6 sentences) and reference the relevant section/heading when helpful, since this is for interview prep.
- The candidate wrote this document themselves — your job is to help them recall and articulate their own reasoning, not to add new reasoning for them.

DOCUMENT (the candidate's own submitted plan):
"""
${DOC_TEXT}
"""`;

let messages = [
  { role: "assistant", text: "Hi! Ask me anything about your Origin drywall experimental plan — hypotheses, the experiment matrix, controls, second-round logic, whatever you want to review before your interview. I'll only answer from what's actually in your document." }
];

const logEl = document.getElementById("log");
const suggestedEl = document.getElementById("suggested");
const qEl = document.getElementById("q");
const sendBtn = document.getElementById("send");
let loading = false;

function render() {
  logEl.innerHTML = "";
  messages.forEach(m => {
    const row = document.createElement("div");
    row.className = "msg " + m.role;
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = m.text;
    row.appendChild(bubble);
    logEl.appendChild(row);
  });
  if (loading) {
    const t = document.createElement("div");
    t.id = "thinking";
    t.textContent = "Thinking…";
    logEl.appendChild(t);
  }
  logEl.scrollTop = logEl.scrollHeight;
}

function renderSuggested() {
  suggestedEl.innerHTML = "";
  SUGGESTED.forEach(s => {
    const b = document.createElement("button");
    b.className = "chip";
    b.textContent = s;
    b.disabled = loading;
    b.onclick = () => ask(s);
    suggestedEl.appendChild(b);
  });
}

async function ask(question) {
  if (!question || !question.trim() || loading) return;
  messages.push({ role: "user", text: question });
  qEl.value = "";
  loading = true;
  render(); renderSuggested(); sendBtn.disabled = true;

  try {
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 500,
        system: SYSTEM_PROMPT,
        messages: messages.map(m => ({
          role: m.role === "user" ? "user" : "assistant",
          content: m.text,
        })),
      }),
    });
    const data = await response.json();
    const textBlock = (data.content || []).find(c => c.type === "text");
    const answer = textBlock ? textBlock.text : "Sorry, I couldn't generate a response just now.";
    messages.push({ role: "assistant", text: answer });
  } catch (err) {
    messages.push({ role: "assistant", text: "Something went wrong reaching the assistant. Please try again." });
  } finally {
    loading = false;
    render(); renderSuggested(); sendBtn.disabled = false;
  }
}

sendBtn.addEventListener("click", () => ask(qEl.value));
qEl.addEventListener("keydown", (e) => { if (e.key === "Enter") ask(qEl.value); });

render();
renderSuggested();
</script>
</body>
</html>
